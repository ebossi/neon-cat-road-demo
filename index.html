<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060f">
  <meta name="format-detection" content="telephone=no">
  <title>Neon Cat Road</title>
  <link rel="icon" href="TemplateData/icon.png">
  <style>
    :root {
      /* Safe-area insets. Defaults come from the browser; a host bridge (Toss getSafeAreaInsets, etc.)
         can override them with NeonCatHost.setInsets(top, right, bottom, left). */
      --inset-top: env(safe-area-inset-top, 0px);
      --inset-right: env(safe-area-inset-right, 0px);
      --inset-bottom: env(safe-area-inset-bottom, 0px);
      --inset-left: env(safe-area-inset-left, 0px);
      --bg: #07060f;
      --neon: #ff4fd8;
      --neon2: #3ef0ff;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: #fff;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    #stage {
      position: fixed;
      top: var(--inset-top); right: var(--inset-right); bottom: var(--inset-bottom); left: var(--inset-left);
      display: flex; align-items: center; justify-content: center;
    }
    /* Portrait game (720x1280 reference). Phones fill the safe area; wide screens get a centred 9:16 column. */
    #frame { position: relative; width: 100%; height: 100%; }
    @media (min-aspect-ratio: 3/4) {
      #frame { height: 100%; width: auto; aspect-ratio: 9 / 16; max-width: 100%; }
    }
    #unity-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; outline: none; background: var(--bg); touch-action: none;
    }
    #loader {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(ellipse at 50% 38%, #1c0f3a 0%, var(--bg) 70%);
      transition: opacity .35s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .logo { text-align: center; line-height: 1.05; font-weight: 800; letter-spacing: .04em; }
    .logo .l1 { font-size: 44px; color: #fff; text-shadow: 0 0 6px var(--neon), 0 0 18px var(--neon), 0 0 36px var(--neon); }
    .logo .l2 { font-size: 26px; color: #fff; margin-top: 6px; text-shadow: 0 0 6px var(--neon2), 0 0 18px var(--neon2); }
    .bar { width: 58%; max-width: 280px; height: 8px; border-radius: 8px; background: #ffffff1a; overflow: hidden;
           box-shadow: 0 0 0 1px #ffffff22 inset; }
    .bar > i { display: block; height: 100%; width: 0; border-radius: 8px;
               background: linear-gradient(90deg, var(--neon2), var(--neon)); box-shadow: 0 0 12px var(--neon);
               transition: width .2s ease; }
    .pct { font-size: 13px; color: #ffffffa0; font-variant-numeric: tabular-nums; min-height: 1em; }
    #error { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; text-align: center;
             padding: 24px; box-sizing: border-box; background: var(--bg); font-size: 15px; line-height: 1.5; }
    #error button { margin-top: 16px; font: inherit; color: #fff; background: transparent; border: 1px solid var(--neon);
                    border-radius: 999px; padding: 8px 22px; box-shadow: 0 0 10px var(--neon); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <div class="logo"><div class="l1">NEON CAT</div><div class="l2">ROAD</div></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="pct" id="pct"></div>
      </div>
      <div id="error"><div><div id="error-msg"></div><button onclick="location.reload()">↻</button></div></div>
    </div>
  </div>
  <script src="TemplateData/platform-config.js?v=20261005-analytics"></script>
  <script src="TemplateData/firebase-analytics.js?v=20261005-2"></script>
  <script>
  (function () {
    var canvas = document.getElementById("unity-canvas");
    var root = document.documentElement;
    var host = window.NeonCatHost = window.NeonCatHost || {};
    host.unity = null;
    host.setInsets = function (top, right, bottom, left) {
      root.style.setProperty("--inset-top", (top | 0) + "px");
      root.style.setProperty("--inset-right", (right | 0) + "px");
      root.style.setProperty("--inset-bottom", (bottom | 0) + "px");
      root.style.setProperty("--inset-left", (left | 0) + "px");
    };
    // Events to the game (ad results, back key...). Queued until the player registers its handler.
    host.__queued = host.__queued || [];
    host.emit = host.emit || function (name, data) {
      if (host.__emit) host.__emit(name, data); else host.__queued.push([name, data]);
    };
    host.debugReport = function (json) { host.state = JSON.parse(json); };

    // Platform hooks the game calls when present (all optional):
    //   hasRewardedAd() -> bool, showRewardedAd() -> false if unavailable; later emit("rewardedAdResult", "1"|"0")
    //   showInterstitialAd() -> false if unavailable; later emit("interstitialAdClosed")
    //   hasPurchases() -> bool, purchase(productId); later emit("purchaseResult", "<id>:ok|cancel|fail|pending");
    //     owned products found at start-up (or verified late): emit("purchaseRestored", "<id>"); refunded: emit("purchaseRevoked", "<id>");
    //     emit("productDetails", "[{id, price, currency, amount}]"), emit("purchasesReady") (ask hasPurchases() again);
    //     adsRemoved() once remove-ads is active
    //   exitApp(), analytics(json), vibrate(ms), onGameReady()
    // ?mockads=1 / ?mockiap=1 install fake ads / payments for testing the flows in a plain browser.
    var mockOverlay = function (label, done) {
      var d = document.createElement("div");
      d.textContent = label;
      d.style.cssText = "position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;" +
        "background:#000d;color:#fff;font:600 22px system-ui";
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); done(); }, 1500);
    };
    if (/[?&]mockads=1/.test(location.search)) {
      host.hasRewardedAd = host.hasRewardedAd || function () { return true; };
      host.showRewardedAd = host.showRewardedAd || function () { mockOverlay("MOCK REWARDED AD", function () { host.emit("rewardedAdResult", "1"); }); };
      host.showInterstitialAd = host.showInterstitialAd || function () { mockOverlay("MOCK INTERSTITIAL", function () { host.emit("interstitialAdClosed"); }); };
    }
    if (/[?&]mockiap=1/.test(location.search)) {
      host.hasPurchases = host.hasPurchases || function () { return true; };
      host.purchase = host.purchase || function (id) { mockOverlay("MOCK PURCHASE " + id, function () { host.emit("purchaseResult", id + ":ok"); }); };
    }

    // Platform adapters. ONE store: the registered URL carries ?platform=onestore (the app frames the game).
    // The engine waits for the adapter's initialisation (bounded) so the game sees the right features at start.
    function inOneStore() {
      if (/[?&]platform=onestore(&|$)/.test(location.search)) return true;
      try {
        var a = location.ancestorOrigins;
        for (var i = 0; a && i < a.length; i++) if (/\.onestore\.(net|co\.kr)$/.test(new URL(a[i]).hostname)) return true;
      } catch (e) {}
      return false;
    }
    var platformReady = Promise.resolve();
    if (inOneStore()) {
      platformReady = Promise.race([
        import("./TemplateData/onestore.js")
          .then(function (m) { return m.start(host, (window.NeonCatConfig || {}).onestore); })
          .catch(function (e) { console.warn("[NeonCat] ONE store adapter failed", e); }),
        new Promise(function (resolve) { setTimeout(resolve, 4000); })
      ]);
    }

    // No pinch zoom, double-tap zoom, long-press menus or rubber-band scrolling inside webviews.
    ["gesturestart", "gesturechange", "gestureend", "contextmenu", "dblclick", "selectstart"].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

    function showError(msg) {
      document.getElementById("error-msg").textContent = msg;
      document.getElementById("error").style.display = "flex";
    }

    var bar = document.getElementById("bar"), pct = document.getElementById("pct");
    var config = {
      arguments: [],
      dataUrl: "Build/5ee3fa70b88231e64ea9ae4b57a7dd1a.data.unityweb",
      frameworkUrl: "Build/b63c302b43dfb6f1d67959bc935615e0.framework.js.unityweb",
      codeUrl: "Build/da38d0d8cd99f02be259a64c8ce7601a.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "lemoncube",
      productName: "Neon Cat Road",
      productVersion: "0.0.4",
      // Phones report DPR 3; rendering above 2x costs fill-rate for no visible gain on this art.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      autoSyncPersistentDataPath: true,
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
    };

    var t0 = performance.now();
    var loaderHidden = false;
    function hideLoader() {
      if (loaderHidden) return;
      loaderHidden = true;
      var el = document.getElementById("loader");
      el.classList.add("done");
      setTimeout(function () { el.style.display = "none"; }, 400);
    }
    // Called by the player before NeonCatHost.onGameReady, so a host adapter may set onGameReady at any time.
    window.__neonCatLoaded = function () {
      host.readyMs = Math.round(performance.now() - t0);
      console.log("[NeonCat] title ready in " + host.readyMs + " ms");
      if (typeof host.analytics === "function") host.analytics(JSON.stringify({ name: "web_game_ready", values: { load_ms: host.readyMs } }));
      hideLoader();
      if (typeof host.__onTitleReady === "function") host.__onTitleReady();
    };
    var script = document.createElement("script");
    script.src = "Build/9f5c00843bfd94e7449e75fdf298da3c.loader.js";
    script.onerror = function () { showError("Failed to load. Check your connection."); };
    script.onload = function () { platformReady.then(boot); };
    function boot() {
      createUnityInstance(canvas, config, function (p) {
        bar.style.width = Math.round(p * 100) + "%";
        pct.textContent = Math.round(p * 100) + "%";
        if (typeof host.__progress === "function") host.__progress(p * 0.95); // 100 is sent at the title
      }).then(function (instance) {
        host.unity = instance;
        host.engineMs = Math.round(performance.now() - t0);
        console.log("[NeonCat] engine ready in " + host.engineMs + " ms");
        // Keep the neon loader up until the title screen reports in (Intro -> NewGame), with a safety timeout.
        setTimeout(hideLoader, 25000);
      }).catch(function (message) {
        showError(String(message));
      });
    }
    document.body.appendChild(script);
  })();
  </script>
</body>
</html>
